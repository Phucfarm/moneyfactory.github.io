<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Money Factory Tycoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <canvas id="gameCanvas"></canvas>

  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-chip">
      <span class="ico">💵</span>
      <span id="hud-money-val">0</span>
      <span class="sub" id="hud-mps-val"></span>
    </div>
    <div class="hud-chip brass">
      <span class="ico">🔬</span>
      <span id="hud-research-val">0</span>
    </div>
    <div class="hud-chip info" id="hud-power-wrap">
      <span class="ico">⚡</span>
      <span id="hud-power-val">0/0</span>
    </div>
    <div id="hud-location">
      <span><b id="hud-zone-name">Zone</b></span>
      <span id="hud-floor-name">Floor</span>
    </div>
    <button id="btn-prestige-flag" class="hidden" data-i18n="hud.prestigeAvailable"></button>
  </div>

  <!-- Zone / floor switch bar -->
  <div id="location-bar">
    <div class="lb-group" id="zone-buttons"></div>
    <div class="lb-group" id="floor-buttons"></div>
  </div>

  <!-- Tier selector -->
  <div id="tier-selector"></div>

  <!-- Bottom-right menu -->
  <nav id="bottom-menu">
    <button class="menu-btn" data-panel="rooms"><span>🏭</span><span class="mb-label" data-i18n="menu.rooms"></span></button>
    <button class="menu-btn" data-panel="prestige"><span>♻️</span><span class="mb-label" data-i18n="menu.prestige"></span><span class="dot" id="dot-prestige"></span></button>
    <button class="menu-btn" data-panel="tech"><span>🧪</span><span class="mb-label" data-i18n="menu.tech"></span><span class="dot" id="dot-tech"></span></button>
    <button class="menu-btn" data-panel="settings"><span>⚙️</span><span class="mb-label" data-i18n="menu.settings"></span></button>
  </nav>

  <!-- Mobile drawer toggle + drawer (extra info / controls help) -->
  <button id="drawer-toggle" class="mobile-only">☰</button>
  <div id="mobile-drawer" class="mobile-only plate hidden" style="position:absolute; left:8px; top:138px; width:200px; z-index:23; padding:10px;"></div>

  <!-- Selected machine panel -->
  <div id="machine-panel" class="plate hidden"></div>

  <!-- Generic modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-content" class="plate"></div>
  </div>

  <!-- Offline earnings modal -->
  <div id="offline-modal" class="hidden">
    <div class="plate">
      <h2 data-i18n="offline.title"></h2>
      <p id="offline-body"></p>
      <div class="o-amount" id="offline-amount"></div>
      <p id="offline-capped-note" class="m-sub hidden" data-i18n="offline.capped"></p>
      <button class="btn brass" id="offline-claim-btn" data-i18n="offline.claim" style="width:100%; padding:12px; font-size:15px;"></button>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast-stack"></div>

  <!-- Rotate notice for mobile portrait -->
  <div id="rotate-notice" class="hidden">
    <div class="spin-icon">📱</div>
    <div data-i18n="app.title" style="font-size:15px; opacity:0.7;"></div>
    <div data-i18n="orientation.rotate">Please rotate your device to landscape</div>
  </div>

</div>

<script src="src/00-data.js"></script>
<script src="src/01-i18n.js"></script>
<script src="src/02-state.js"></script>
<script src="src/03-save.js"></script>
<script src="src/04-economy.js"></script>
<script src="src/05-factory.js"></script>
<script src="src/08-audio.js"></script>
<script src="src/09-render.js"></script>
<script src="src/10-input.js"></script>
<script src="src/11-ui.js"></script>
<script src="src/12-main.js"></script>
</body>
</html>
