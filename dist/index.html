<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Money Factory Tycoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
<style>
/* ============================================================
   style.css — Money Factory Tycoon
   Visual identity: industrial print-shop / mint. Brass + cash-
   green accents on a dark factory-floor base. Condensed display
   type for HUD numbers, humanist sans for UI text.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg-deep: #12141a;
  --bg-panel: #1c2028;
  --bg-panel-2: #262b35;
  --bg-panel-3: #2f3542;
  --line: rgba(255,255,255,0.09);
  --line-strong: rgba(255,255,255,0.16);

  --accent-cash: #3ddc84;
  --accent-cash-dim: #24a05e;
  --accent-brass: #d9a441;
  --accent-brass-dim: #a97d2e;
  --accent-warn: #ff6b4a;
  --accent-info: #5b8cff;
  --accent-mythic: #ff5da2;

  --text-primary: #eef1f5;
  --text-secondary: #b7bfcc;
  --text-muted: #7c8494;

  --font-display: 'Oswald', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
}

#app {
  position: fixed; inset: 0;
  display: flex;
  flex-direction: column;
  user-select: none;
}

#gameCanvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#gameCanvas:active { cursor: grabbing; }

/* ---------------- Rivet / metal-plate panel treatment ---------------- */
.plate {
  background: linear-gradient(180deg, var(--bg-panel-3) 0%, var(--bg-panel) 70%);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-md);
  box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  position: relative;
}
.plate::before, .plate::after {
  content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #6b7280, #24272f);
  top: 6px; box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
}
.plate::before { left: 6px; }
.plate::after { right: 6px; }

/* ---------------- Top HUD ---------------- */
#hud-top {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  background: linear-gradient(180deg, rgba(18,20,26,0.96), rgba(18,20,26,0.75));
  border-bottom: 1px solid var(--line);
  z-index: 20;
  backdrop-filter: blur(4px);
}
.hud-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent-cash);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.hud-chip.brass { border-left-color: var(--accent-brass); }
.hud-chip.info { border-left-color: var(--accent-info); }
.hud-chip .ico { font-size: 15px; opacity: 0.85; }
.hud-chip .sub { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); font-weight: 500; }

#hud-location {
  font-family: var(--font-body); font-size: 12px; color: var(--text-secondary);
  margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 1px;
}
#hud-location b { color: var(--text-primary); font-weight: 600; }

#btn-prestige-flag {
  border: none; border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #ffb238, #c8811d);
  color: #241701; font-family: var(--font-display); font-size: 13px;
  padding: 6px 10px; cursor: pointer; font-weight: 600;
  animation: pulse-glow 1.6s ease-in-out infinite;
  white-space: nowrap;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,178,56,0.55); }
  50% { box-shadow: 0 0 0 8px rgba(255,178,56,0); }
}

/* ---------------- Location bar (zones / floors) ---------------- */
#location-bar {
  position: absolute; top: 46px; left: 10px; right: 10px;
  display: flex; gap: 6px; align-items: center;
  z-index: 19;
  pointer-events: none;
}
#location-bar .lb-group { display: flex; gap: 4px; pointer-events: auto; background: rgba(18,20,26,0.7); padding: 3px; border-radius: var(--radius-sm); border: 1px solid var(--line); }
.lb-btn {
  font-family: var(--font-body); font-size: 12px; font-weight: 600;
  padding: 5px 9px; border-radius: 5px; border: 1px solid transparent;
  background: transparent; color: var(--text-secondary); cursor: pointer;
  white-space: nowrap;
}
.lb-btn.active { background: var(--bg-panel-3); color: var(--accent-cash); border-color: var(--line-strong); }
.lb-btn.locked { color: var(--text-muted); }
.lb-btn .lock-cost { display: block; font-size: 10px; color: var(--accent-brass); font-weight: 500; }

/* ---------------- Tier selector ---------------- */
#tier-selector {
  position: absolute; left: 10px; bottom: 10px;
  display: flex; gap: 6px; z-index: 19;
}
.tier-btn {
  width: 52px; height: 52px; border-radius: var(--radius-sm);
  border: 2px solid var(--line-strong); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 10px; color: white;
  background: var(--bg-panel-2);
  position: relative;
  opacity: 0.55;
}
.tier-btn .cost { font-size: 9px; font-family: var(--font-body); opacity: 0.85; }
.tier-btn.unlocked { opacity: 1; }
.tier-btn.selected { border-color: white; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }
.tier-btn .swatch { width: 16px; height: 16px; border-radius: 4px; margin-bottom: 2px; }
.tier-btn .lockicon { position: absolute; top: 2px; right: 3px; font-size: 10px; }

/* ---------------- Bottom menu ---------------- */
#bottom-menu {
  position: absolute; right: 10px; bottom: 10px;
  display: flex; gap: 6px; z-index: 19;
}
.menu-btn {
  font-family: var(--font-display); font-size: 13px;
  background: var(--bg-panel); border: 1px solid var(--line-strong);
  color: var(--text-primary); border-radius: var(--radius-sm);
  padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  position: relative;
}
.menu-btn .dot { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-warn); display: none; }
.menu-btn .dot.show { display: block; }

/* ---------------- Machine side panel ---------------- */
#machine-panel {
  position: absolute; top: 90px; right: 10px; width: 260px;
  z-index: 21; padding: 12px; max-height: calc(100% - 180px); overflow-y: auto;
}
#machine-panel h3 { margin: 4px 0 2px; font-family: var(--font-display); font-size: 18px; }
#machine-panel .m-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.upg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); }
.upg-row:first-of-type { border-top: none; }
.upg-name { font-size: 13px; font-weight: 600; }
.upg-level { font-size: 11px; color: var(--text-muted); }
.btn {
  font-family: var(--font-body); font-weight: 600; font-size: 12px;
  border: none; border-radius: var(--radius-sm); padding: 7px 10px; cursor: pointer;
  background: var(--accent-cash-dim); color: #05230f;
}
.btn:hover { filter: brightness(1.12); }
.btn:disabled { background: #3a3f4a; color: var(--text-muted); cursor: not-allowed; }
.btn.brass { background: var(--accent-brass); color: #2a1c02; }
.btn.warn { background: var(--accent-warn); color: #2a0d02; }
.btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--text-primary); }
.panel-close { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }

/* ---------------- Modal overlay ---------------- */
#modal-overlay {
  position: absolute; inset: 0; z-index: 30;
  background: rgba(8,9,12,0.72);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
#modal-content {
  width: min(720px, 100%); max-height: 92%; overflow-y: auto;
  padding: 18px;
}
#modal-content h2 { font-family: var(--font-display); font-size: 24px; margin: 4px 0 6px; }
#modal-content .m-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
.tab-row { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.tab-btn { background: none; border: none; color: var(--text-muted); font-family: var(--font-display); font-size: 14px; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--accent-cash); border-bottom-color: var(--accent-cash); }

.room-card, .list-row {
  display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 8px;
  background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.room-card .r-icon { font-size: 26px; width: 40px; text-align: center; }
.room-card .r-body { flex: 1; min-width: 0; }
.room-card .r-title { font-family: var(--font-display); font-size: 16px; }
.room-card .r-desc { font-size: 12px; color: var(--text-muted); }
.bar-track { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent-cash); }

.tech-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tech-branch h4 { font-family: var(--font-display); font-size: 14px; color: var(--text-secondary); margin: 0 0 8px; text-transform: none; }
.tech-node {
  padding: 9px; margin-bottom: 6px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--bg-panel-2);
  font-size: 12px; cursor: pointer;
}
.tech-node.owned { border-color: var(--accent-cash-dim); background: rgba(61,220,132,0.09); cursor: default; }
.tech-node.locked { opacity: 0.45; cursor: not-allowed; }
.tech-node .t-name { font-weight: 700; margin-bottom: 2px; }
.tech-node .t-cost { color: var(--accent-brass); font-size: 11px; }

.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px dashed var(--line); }
.setting-row:first-of-type { border-top: none; }
.lang-toggle { display: flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.lang-toggle button { border: none; background: var(--bg-panel-2); color: var(--text-secondary); padding: 6px 14px; font-family: var(--font-body); font-weight: 600; font-size: 12px; cursor: pointer; }
.lang-toggle button.active { background: var(--accent-cash-dim); color: #05230f; }
.switch { position: relative; width: 42px; height: 24px; }
.switch input { display:none; }
.switch .track { position: absolute; inset: 0; background: #3a3f4a; border-radius: 999px; transition: background 0.15s; }
.switch input:checked + .track { background: var(--accent-cash-dim); }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: white; transition: transform 0.15s; }
.switch input:checked + .track + .knob { transform: translateX(18px); }

/* ---------------- Prestige modal ---------------- */
.prestige-big { text-align: center; padding: 10px 0 18px; }
.prestige-big .p-gain { font-family: var(--font-display); font-size: 34px; color: var(--accent-brass); }

/* ---------------- Offline earnings modal ---------------- */
#offline-modal {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(8,9,12,0.8); display: flex; align-items: center; justify-content: center;
}
#offline-modal .plate { width: min(420px, 92%); padding: 22px; text-align: center; }
#offline-modal .o-amount { font-family: var(--font-display); font-size: 30px; color: var(--accent-cash); margin: 10px 0; }

/* ---------------- Toasts ---------------- */
#toast-stack {
  position: absolute; left: 50%; top: 82px; transform: translateX(-50%);
  z-index: 35; display: flex; flex-direction: column; gap: 6px; align-items: center;
  pointer-events: none;
}
.toast {
  font-family: var(--font-body); font-weight: 600; font-size: 13px;
  background: rgba(20,22,28,0.94); border: 1px solid var(--line-strong);
  border-left: 3px solid var(--accent-cash); padding: 7px 12px; border-radius: var(--radius-sm);
  animation: toast-in 0.18s ease-out, toast-out 0.3s ease-in 2.4s forwards;
  white-space: nowrap;
}
.toast.warn { border-left-color: var(--accent-warn); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-6px); } }

/* ---------------- Rotate notice ---------------- */
#rotate-notice {
  position: fixed; inset: 0; z-index: 100; background: var(--bg-deep);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-display); font-size: 20px; text-align: center; padding: 20px;
}
#rotate-notice .spin-icon { font-size: 44px; animation: spin 1.6s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.hidden { display: none !important; }

/* ============================================================
   Responsive: mobile landscape gets a dedicated touch layout.
   Breakpoint by pointer/touch + narrower viewport height.
   ============================================================ */
@media (pointer: coarse), (hover: none) {
  .mobile-only { display: block; }
  #bottom-menu { flex-direction: column; right: 8px; bottom: auto; top: 90px; }
  .menu-btn { padding: 10px; font-size: 0; width: 44px; height: 44px; justify-content: center; }
  .menu-btn .mb-label { display: none; }
  #tier-selector { left: 8px; bottom: 8px; }
  .tier-btn { width: 46px; height: 46px; }
  #machine-panel { right: 8px; top: 8px; width: 220px; max-height: 70%; }
  #location-bar { top: 44px; }
  #drawer-toggle {
    position: absolute; left: 10px; top: 90px; z-index: 22;
    width: 40px; height: 40px; border-radius: var(--radius-sm);
    background: var(--bg-panel); border: 1px solid var(--line-strong); color: var(--text-primary);
    font-size: 18px;
  }
}


</style>
</head>
<body>
<div id="app">

  <canvas id="gameCanvas"></canvas>

  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-chip">
      <span class="ico">💵</span>
      <span id="hud-money-val">0</span>
      <span class="sub" id="hud-mps-val"></span>
    </div>
    <div class="hud-chip brass">
      <span class="ico">🔬</span>
      <span id="hud-research-val">0</span>
    </div>
    <div class="hud-chip info" id="hud-power-wrap">
      <span class="ico">⚡</span>
      <span id="hud-power-val">0/0</span>
    </div>
    <div id="hud-location">
      <span><b id="hud-zone-name">Zone</b></span>
      <span id="hud-floor-name">Floor</span>
    </div>
    <button id="btn-prestige-flag" class="hidden" data-i18n="hud.prestigeAvailable"></button>
  </div>

  <!-- Zone / floor switch bar -->
  <div id="location-bar">
    <div class="lb-group" id="zone-buttons"></div>
    <div class="lb-group" id="floor-buttons"></div>
  </div>

  <!-- Tier selector -->
  <div id="tier-selector"></div>

  <!-- Bottom-right menu -->
  <nav id="bottom-menu">
    <button class="menu-btn" data-panel="rooms"><span>🏭</span><span class="mb-label" data-i18n="menu.rooms"></span></button>
    <button class="menu-btn" data-panel="prestige"><span>♻️</span><span class="mb-label" data-i18n="menu.prestige"></span><span class="dot" id="dot-prestige"></span></button>
    <button class="menu-btn" data-panel="tech"><span>🧪</span><span class="mb-label" data-i18n="menu.tech"></span><span class="dot" id="dot-tech"></span></button>
    <button class="menu-btn" data-panel="settings"><span>⚙️</span><span class="mb-label" data-i18n="menu.settings"></span></button>
  </nav>

  <!-- Mobile drawer toggle + drawer (extra info / controls help) -->
  <button id="drawer-toggle" class="mobile-only">☰</button>
  <div id="mobile-drawer" class="mobile-only plate hidden" style="position:absolute; left:8px; top:138px; width:200px; z-index:23; padding:10px;"></div>

  <!-- Selected machine panel -->
  <div id="machine-panel" class="plate hidden"></div>

  <!-- Generic modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-content" class="plate"></div>
  </div>

  <!-- Offline earnings modal -->
  <div id="offline-modal" class="hidden">
    <div class="plate">
      <h2 data-i18n="offline.title"></h2>
      <p id="offline-body"></p>
      <div class="o-amount" id="offline-amount"></div>
      <p id="offline-capped-note" class="m-sub hidden" data-i18n="offline.capped"></p>
      <button class="btn brass" id="offline-claim-btn" data-i18n="offline.claim" style="width:100%; padding:12px; font-size:15px;"></button>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast-stack"></div>

  <!-- Rotate notice for mobile portrait -->
  <div id="rotate-notice" class="hidden">
    <div class="spin-icon">📱</div>
    <div data-i18n="app.title" style="font-size:15px; opacity:0.7;"></div>
    <div data-i18n="orientation.rotate">Please rotate your device to landscape</div>
  </div>

</div>












<script>

/* ---- src/00-data.js ---- */
/* ============================================================
   00-data.js — Static game content/data definitions.
   Single source for all balancing numbers & content lists.
   ============================================================ */
(function (G) {
  "use strict";

  // ---- Machine tiers -------------------------------------------------
  // Each tier defines base economics + visuals. Machine "types" within a
  // tier are thin flavor wrappers (name/color offset) sharing tier math,
  // but tiers themselves are the meaningful gameplay differentiator.
  const TIERS = [
    {
      id: "common",
      name: "common",
      order: 0,
      color: "#9aa5ad",
      glow: "#c7cfd4",
      baseCost: 50,
      costGrowth: 1.14,
      baseCooldown: 2.2,          // seconds per cycle at level 0
      baseYield: 1,                // $ per cycle at level 0
      unlockRequirement: null,     // always available
      particleDensity: 0.5,
      critChance: 0.02,
      critMult: 2,
    },
    {
      id: "uncommon",
      name: "uncommon",
      order: 1,
      color: "#57b871",
      glow: "#9be3ae",
      baseCost: 1200,
      costGrowth: 1.15,
      baseCooldown: 1.9,
      baseYield: 8,
      unlockRequirement: { type: "money", amount: 500 },
      particleDensity: 0.7,
      critChance: 0.035,
      critMult: 2.2,
    },
    {
      id: "epic",
      name: "epic",
      order: 2,
      color: "#7a5cff",
      glow: "#b6a4ff",
      baseCost: 32000,
      costGrowth: 1.16,
      baseCooldown: 1.6,
      baseYield: 65,
      unlockRequirement: { type: "money", amount: 15000 },
      particleDensity: 1.0,
      critChance: 0.05,
      critMult: 2.5,
    },
    {
      id: "legendary",
      name: "legendary",
      order: 3,
      color: "#ffb238",
      glow: "#ffd98a",
      baseCost: 900000,
      costGrowth: 1.17,
      baseCooldown: 1.3,
      baseYield: 560,
      unlockRequirement: { type: "money", amount: 400000 },
      particleDensity: 1.3,
      critChance: 0.07,
      critMult: 3,
    },
    {
      id: "mythic",
      name: "mythic",
      order: 4,
      color: "#ff5da2",
      glow: "#ffb2d6",
      baseCost: 25000000,
      costGrowth: 1.18,
      baseCooldown: 1.0,
      baseYield: 4800,
      unlockRequirement: { type: "prestige", amount: 1 },
      particleDensity: 1.7,
      critChance: 0.1,
      critMult: 3.5,
    },
  ];

  // ---- Machine "types" — flavor variants, 1 per tier is enough to keep
  // scope sane while still giving each tier a distinct printer to place.
  const MACHINE_TYPES = TIERS.map((t, i) => ({
    id: "printer_" + t.id,
    tierId: t.id,
    nameKey: "machine." + t.id + ".name",
    descKey: "machine." + t.id + ".desc",
  }));

  // Upgrade definitions applied per-machine-instance. Each upgrade has
  // discrete levels; cost scales per level; effect scales per level.
  const UPGRADES = {
    speed: { id: "speed", nameKey: "upgrade.speed", maxLevel: 20, baseCost: 25, costGrowth: 1.22, effectPerLevel: 0.035 }, // -3.5% cooldown/lvl
    output: { id: "output", nameKey: "upgrade.output", maxLevel: 20, baseCost: 30, costGrowth: 1.22, effectPerLevel: 0.08 }, // +8% yield/lvl
    ink: { id: "ink", nameKey: "upgrade.ink", maxLevel: 10, baseCost: 60, costGrowth: 1.3, effectPerLevel: 0.01 }, // +1% crit chance/lvl, +0.15 crit mult/lvl
  };

  // ---- Factory layout: zones -> floors -> grid slots -----------------
  const GRID_COLS = 6;
  const GRID_ROWS = 4;

  const ZONES = [
    {
      id: "zone_downtown",
      nameKey: "zone.downtown.name",
      unlock: null, // starter zone
      floors: [
        { id: "z1f1", nameKey: "floor.1", unlock: null },
        { id: "z1f2", nameKey: "floor.2", unlock: { type: "money", amount: 8000 } },
      ],
    },
    {
      id: "zone_industrial",
      nameKey: "zone.industrial.name",

  let currentLang = "en";
  const listeners = [];

  function t(key, params) {
    const dict = STRINGS[currentLang] || STRINGS.en;
    let str = dict[key];
    if (str === undefined) str = STRINGS.en[key];
    if (str === undefined) return key;
    if (params) {
      Object.keys(params).forEach((p) => {
        str = str.replace(new RegExp("\\{" + p + "\\}", "g"), params[p]);
      });
    }
    return str;
  }

  function setLang(lang) {
    if (!STRINGS[lang]) return;
    currentLang = lang;
    applyToDom();
    listeners.forEach((fn) => {
      try { fn(lang); } catch (e) { console.error(e); }
    });
  }

  function getLang() { return currentLang; }

  function onChange(fn) { listeners.push(fn); }

  function applyToDom() {
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      el.textContent = t(key);
    });
    document.querySelectorAll("[data-i18n-attr]").forEach((el) => {
      // format: data-i18n-attr="placeholder:some.key|title:other.key"
      const spec = el.getAttribute("data-i18n-attr");
      spec.split("|").forEach((pair) => {
        const [attr, key] = pair.split(":");
        if (attr && key) el.setAttribute(attr, t(key));
      });
    });
    document.documentElement.setAttribute("lang", currentLang);
  }

  G.i18n = { t, setLang, getLang, onChange, applyToDom, STRINGS };
})(window.Game = window.Game || {});

        slots.push({
          r, c,
          machine: null, // { typeId, tierId, levels: {speed,output,ink,auto}, progress: 0..1, lastCollectAmount }
        });
      }
    }
    return slots;
  }

  function makeFloor(floorDef) {
    return {
      id: floorDef.id,
      unlocked: !floorDef.unlock,
      grid: makeEmptyGrid(),
      systems: {
        conveyor: 0,
        collector: 0,
      },
    };
  }

  function makeZone(zoneDef) {
    return {
      id: zoneDef.id,
      unlocked: !zoneDef.unlock,
      floors: zoneDef.floors.map(makeFloor),
    };
  }

  function defaultState() {
    return {
      saveVersion: SAVE_VERSION,
      createdAt: Date.now(),
      lastSaveTime: Date.now(),
      lastActiveTime: Date.now(),

      money: 50,
      totalEarned: 0,       // this prestige run (resets on rebirth)
      lifetimeEarned: 0,    // total cash ever granted; used for lifetime unlocks/stats only
      maxMoney: 50,         // highest cash balance ever reached in the current run

      research: 0,          // research points from R&D room; spent on Tech Tree purchases
      offlinePending: null, // persisted offline reward waiting for player claim

      currentZoneId: D.ZONES[0].id,
      currentFloorId: D.ZONES[0].floors[0].id,
      zones: D.ZONES.map(makeZone),

      rooms: {
        rnd: { level: 0 },
        vault: { level: 0 },
        power: { level: 0 },
      },

      prestige: {
        count: 0,
        perkPoints: 0,
        tech: {}, // techId -> true
      },

      settings: {
        lang: "en",
        music: true,
        sfx: true,
        musicVolume: 0.35,
        sfxVolume: 0.7,
      },

      camera: { x: 0, y: 0, zoom: 1 },

      selectedTierId: "common",

      stats: {
        totalClicks: 0,
        totalMachinesPlaced: 0,
        totalUpgradesBought: 0,
        playTimeSeconds: 0,
      },
    };
  }

  // ---- Defensive merge: fills in any missing/invalid fields from a
  // loaded save with sensible defaults so corrupt/partial saves never
  // crash the game (spec section 23).
  function sanitizeState(loaded) {
    const base = defaultState();
    if (!loaded || typeof loaded !== "object") return base;

    const out = base;
    try {
      if (typeof loaded.money === "number" && isFinite(loaded.money) && loaded.money >= 0) out.money = loaded.money;
      if (typeof loaded.totalEarned === "number" && isFinite(loaded.totalEarned)) out.totalEarned = Math.max(0, loaded.totalEarned);
      if (typeof loaded.lifetimeEarned === "number" && isFinite(loaded.lifetimeEarned)) out.lifetimeEarned = Math.max(0, loaded.lifetimeEarned);
      if (typeof loaded.maxMoney === "number" && isFinite(loaded.maxMoney)) out.maxMoney = Math.max(0, loaded.maxMoney);
      out.maxMoney = Math.max(out.maxMoney, out.money);
      if (typeof loaded.research === "number" && isFinite(loaded.research)) out.research = Math.max(0, loaded.research);
      if (loaded.offlinePending && typeof loaded.offlinePending === "object") {
        const p = loaded.offlinePending;
        const finite = (v) => typeof v === "number" && isFinite(v);
        if (finite(p.amount) && p.amount >= 0 && finite(p.production) && p.production >= 0 && finite(p.interestGained) && p.interestGained >= 0 && finite(p.researchGained) && p.researchGained >= 0 && finite(p.cappedSeconds) && p.cappedSeconds >= 0 && finite(p.capHours) && p.capHours >= 0 && finite(p.elapsedSeconds) && p.elapsedSeconds >= 0) {
          out.offlinePending = {
            amount: p.amount,
            production: p.production,
            interestGained: p.interestGained,
            researchGained: p.researchGained,
            cappedSeconds: p.cappedSeconds,
            capHours: p.capHours,
            wasCapped: !!p.wasCapped,
            elapsedSeconds: p.elapsedSeconds,
          };
        }
      }
      if (typeof loaded.lastSaveTime === "number" && isFinite(loaded.lastSaveTime) && loaded.lastSaveTime >= 0) out.lastSaveTime = loaded.lastSaveTime;
      if (typeof loaded.lastActiveTime === "number" && isFinite(loaded.lastActiveTime) && loaded.lastActiveTime >= 0) out.lastActiveTime = loaded.lastActiveTime;
      if (typeof loaded.createdAt === "number" && isFinite(loaded.createdAt) && loaded.createdAt >= 0) out.createdAt = loaded.createdAt;

      if (loaded.settings && typeof loaded.settings === "object") {
        if (loaded.settings.lang === "en" || loaded.settings.lang === "vi") out.settings.lang = loaded.settings.lang;
        if (typeof loaded.settings.music === "boolean") out.settings.music = loaded.settings.music;
        if (typeof loaded.settings.sfx === "boolean") out.settings.sfx = loaded.settings.sfx;
        if (typeof loaded.settings.musicVolume === "number") out.settings.musicVolume = clamp01(loaded.settings.musicVolume);
        if (typeof loaded.settings.sfxVolume === "number") out.settings.sfxVolume = clamp01(loaded.settings.sfxVolume);
      }

      if (loaded.prestige && typeof loaded.prestige === "object") {
        if (typeof loaded.prestige.count === "number") out.prestige.count = Math.max(0, Math.floor(loaded.prestige.count));
        if (typeof loaded.prestige.perkPoints === "number") out.prestige.perkPoints = Math.max(0, Math.floor(loaded.prestige.perkPoints));
        if (loaded.prestige.tech && typeof loaded.prestige.tech === "object") {
          D.TECH_TREE.forEach((t) => {
            if (loaded.prestige.tech[t.id] && t.requires.every((req) => !!out.prestige.tech[req])) out.prestige.tech[t.id] = true;
          });
        }
      }

      if (loaded.rooms && typeof loaded.rooms === "object") {
        ["rnd", "vault", "power"].forEach((k) => {
          const def = D.ROOMS[k];
          const lvl = loaded.rooms[k] && loaded.rooms[k].level;
          if (typeof lvl === "number" && isFinite(lvl)) {
            out.rooms[k].level = Math.max(0, Math.min(def.maxLevel, Math.floor(lvl)));
          }
        });
      }

      if (typeof loaded.selectedTierId === "string" && D.tierById(loaded.selectedTierId)) {
        out.selectedTierId = loaded.selectedTierId;
      }

      if (loaded.camera && typeof loaded.camera === "object") {
        if (typeof loaded.camera.x === "number") out.camera.x = loaded.camera.x;
        if (typeof loaded.camera.y === "number") out.camera.y = loaded.camera.y;
        if (typeof loaded.camera.zoom === "number" && loaded.camera.zoom > 0) out.camera.zoom = clamp(loaded.camera.zoom, 0.5, 2.5);
      }

      if (typeof loaded.currentZoneId === "string" && D.zoneById(loaded.currentZoneId)) out.currentZoneId = loaded.currentZoneId;

      // Zones/floors/grid — merge by id, ignore anything unrecognized/corrupt.
      if (Array.isArray(loaded.zones)) {
        out.zones.forEach((zone) => {
          const lz = loaded.zones.find((z) => z && z.id === zone.id);
          if (!lz) return;
          if (typeof lz.unlocked === "boolean") zone.unlocked = lz.unlocked || zone.unlocked;
          if (Array.isArray(lz.floors)) {
            zone.floors.forEach((floor) => {
              const lf = lz.floors.find((f) => f && f.id === floor.id);
              if (!lf) return;
              if (typeof lf.unlocked === "boolean") floor.unlocked = lf.unlocked || floor.unlocked;
              if (lf.systems && typeof lf.systems === "object") {
                ["conveyor", "collector"].forEach((k) => {
                  const v = lf.systems[k];
                  if (typeof v === "number" && isFinite(v)) {
                    floor.systems[k] = Math.max(0, Math.floor(v));
                  }
                });
              }
              if (Array.isArray(lf.grid)) {
                floor.grid.forEach((slot) => {
                  const ls = lf.grid.find((s) => s && s.r === slot.r && s.c === slot.c);
                  if (!ls || !ls.machine) return;
                  const m = ls.machine;
                  if (typeof m.typeId === "string" && D.machineTypeById(m.typeId)) {
                    slot.machine = {
                      typeId: m.typeId,
                      // tierId is derived from the validated machine type so a corrupt/mismatched
                      // tier cannot enter the runtime state.
                      tierId: D.machineTypeById(m.typeId).tierId,
                      levels: {
                        speed: safeLevel(m.levels && m.levels.speed, D.UPGRADES.speed.maxLevel),
                        output: safeLevel(m.levels && m.levels.output, D.UPGRADES.output.maxLevel),
                        ink: safeLevel(m.levels && m.levels.ink, D.UPGRADES.ink.maxLevel),
                      },
                      progress: typeof m.progress === "number" && isFinite(m.progress) ? clamp01(m.progress) : 0,
                      banked: typeof m.banked === "number" && isFinite(m.banked) ? Math.max(0, m.banked) : 0,
                    };
                  }
                });
              }
              if (typeof lf.id === "string" && loaded.currentFloorId === lf.id) {
                // handled below
              }
            });
          }
        });
      }
      // Keep the active location valid and accessible.
      const activeZone = D.zoneById(out.currentZoneId);
      if (!activeZone) out.currentZoneId = D.ZONES[0].id;
      else if (!out.zones.find((z) => z.id === out.currentZoneId && z.unlocked)) {
        const fallback = out.zones.find((z) => z.unlocked);
        out.currentZoneId = fallback ? fallback.id : D.ZONES[0].id;
      }
      const activeZoneState = out.zones.find((z) => z.id === out.currentZoneId);
      const requestedFloor = typeof loaded.currentFloorId === "string" ? loaded.currentFloorId : null;
      if (activeZoneState) {
        const wanted = activeZoneState.floors.find((f) => f.id === requestedFloor && f.unlocked);
        const fallbackFloor = activeZoneState.floors.find((f) => f.unlocked);
        out.currentFloorId = wanted ? wanted.id : (fallbackFloor ? fallbackFloor.id : D.ZONES.find((z) => z.id === out.currentZoneId).floors[0].id);
      }

      out.lifetimeEarned = Math.max(out.lifetimeEarned, out.totalEarned);
      out.maxMoney = Math.max(out.maxMoney, out.money);

      if (loaded.stats && typeof loaded.stats === "object") {
        Object.keys(out.stats).forEach((k) => {
          if (typeof loaded.stats[k] === "number" && isFinite(loaded.stats[k])) out.stats[k] = Math.max(0, loaded.stats[k]);
        });
      }
    } catch (e) {
      console.error("Save sanitize error, falling back to safe defaults for affected fields:", e);
    }
    return out;
  }

  function safeLevel(v, max) {
    if (typeof v !== "number" || !isFinite(v) || v < 0) return 0;
    return Math.min(max, Math.floor(v));
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function clamp01(v) { return clamp(v, 0, 1); }

  G.State = {
    SAVE_VERSION,
    defaultState,
    sanitizeState,
    clamp,
    clamp01,
  };
})(window.Game = window.Game || {});

/* ============================================================
   03-save.js — LocalStorage persistence layer.
   Defensive: any corrupt/missing/invalid data falls back to safe
   defaults (via Game.State.sanitizeState) rather than crashing.
   ============================================================ */
(function (G) {
  "use strict";

  const SAVE_KEY = "moneyFactoryTycoon.save.v1";
  const AUTOSAVE_INTERVAL_SEC = 20;

  function isStorageAvailable() {
    try {
      const k = "__mft_test__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  const storageAvailable = isStorageAvailable();

  function save(state) {
    if (!storageAvailable) return false;
    try {
      state.lastSaveTime = Date.now();
      const json = JSON.stringify(state);
      window.localStorage.setItem(SAVE_KEY, json);
      return true;
    } catch (e) {
      console.error("Save failed:", e);
      return false;
    }
  }

  function loadRaw() {
    if (!storageAvailable) return null;
    try {
      const json = window.localStorage.getItem(SAVE_KEY);
      if (!json) return null;
      return JSON.parse(json);
    } catch (e) {
      console.error("Save data corrupt, ignoring and using defaults:", e);
      return null;
    }
  }

  // Returns { state, isNewGame, offlineElapsedSeconds }
  function load() {
    const raw = loadRaw();
    const state = G.State.sanitizeState(raw);
    const isNewGame = !raw;
    let offlineElapsedSeconds = 0;
    if (!isNewGame && typeof raw.lastActiveTime === "number") {
      offlineElapsedSeconds = Math.max(0, (Date.now() - raw.lastActiveTime) / 1000);
    }
    return { state, isNewGame, offlineElapsedSeconds };
  }

  function hardReset() {
    if (storageAvailable) {
      try { window.localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
    }
    return G.State.defaultState();
  }

  function exportSave(state) {
    try {
      return btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    } catch (e) {
      return null;
    }
  }

  function importSave(base64) {
    try {
      const json = decodeURIComponent(escape(atob(base64.trim())));
      const raw = JSON.parse(json);
      return G.State.sanitizeState(raw);
    } catch (e) {
      console.error("Import failed:", e);
      return null;
    }
  }

  G.Save = {
    SAVE_KEY, AUTOSAVE_INTERVAL_SEC, storageAvailable,
    save, load, loadRaw, hardReset, exportSave, importSave,
  };
})(window.Game = window.Game || {});

/* ============================================================
   04-economy.js — All numeric formulas in one place.
   Pure functions operating on (state, DATA) -> numbers.
   Keeping formulas centralized avoids drift/duplication bugs.
   ============================================================ */
(function (G) {
  "use strict";
  const D = G.DATA;

  // ---- Tech tree effect aggregation -----------------------------------
  function techEffects(state) {
    const eff = {
      globalOutputMult: 0,
      globalSpeedMult: 0,
      critChanceAdd: 0,
      powerDiscount: 0,
      collectorSpeedMult: 0,
      rndRateMult: 0,
      upgradeDiscount: 0,
      offlineCapAdd: 0,
      machineCostDiscount: 0,
      startingMoneyMult: 0,
      prestigeGainMult: 0,
    };
    Object.keys(state.prestige.tech).forEach((id) => {
      if (!state.prestige.tech[id]) return;
      const t = D.techById(id);
      if (!t) return;
      const e = t.effect;
      if (eff[e.type] !== undefined) eff[e.type] += e.value;
    });
    return eff;
  }

  // ---- Machine placement cost: scales with how many of that tier are
  // already placed anywhere in the factory (global count per tier). ----
  function tierPlacedCount(state, tierId) {
    let n = 0;
    state.zones.forEach((z) => z.floors.forEach((f) => f.grid.forEach((s) => {
      if (s.machine && s.machine.tierId === tierId) n++;
    })));
    return n;
  }

  function machineCost(state, tierId) {
    const tier = D.tierById(tierId);
    const n = tierPlacedCount(state, tierId);
    const eff = techEffects(state);
    const raw = tier.baseCost * Math.pow(tier.costGrowth, n);
    return Math.ceil(raw * (1 - Math.min(0.6, eff.machineCostDiscount)));
  }

  function tierUnlocked(state, tierId) {
    const tier = D.tierById(tierId);
    if (!tier.unlockRequirement) return true;
    const req = tier.unlockRequirement;
    if (req.type === "money") return state.lifetimeEarned >= req.amount;
    if (req.type === "prestige") return state.prestige.count >= req.amount;
    return false;
  }

  // ---- Per-machine-instance upgrade costs/effects ----------------------
  function upgradeCost(upgradeId, currentLevel, state) {
    const u = D.UPGRADES[upgradeId];
    const eff = techEffects(state);
    const raw = u.baseCost * Math.pow(u.costGrowth, currentLevel);
    return Math.ceil(raw * (1 - Math.min(0.5, eff.upgradeDiscount)));
  }

  function machineCooldown(machine, state) {
    const tier = D.tierById(machine.tierId);
    const eff = techEffects(state);
    const speedLvl = machine.levels.speed;
    const reduction = 1 - Math.min(0.75, D.UPGRADES.speed.effectPerLevel * speedLvl + eff.globalSpeedMult);
    return Math.max(0.15, tier.baseCooldown * reduction);
  }

  function machineBaseYield(machine, floorMult, state) {
    const tier = D.tierById(machine.tierId);
    const eff = techEffects(state);
    const outputLvl = machine.levels.output;
    const outputMult = 1 + D.UPGRADES.output.effectPerLevel * outputLvl + eff.globalOutputMult;
    return tier.baseYield * outputMult * floorMult;
  }

  function machineCritChance(machine, state) {
    const tier = D.tierById(machine.tierId);
    const eff = techEffects(state);
    const inkLvl = machine.levels.ink;
    return Math.min(0.6, tier.critChance + D.UPGRADES.ink.effectPerLevel * inkLvl + eff.critChanceAdd);
  }

  function machineCritMult(machine) {
    const tier = D.tierById(machine.tierId);
    const inkLvl = machine.levels.ink;
    return tier.critMult + 0.15 * inkLvl;
  }

  // ---- Floor-level systems ----------------------------------------------
  function floorOutputMult(floor) {
    const lvl = floor.systems.conveyor;
    return 1 + D.FLOOR_SYSTEMS.conveyor.effectPerLevel * lvl;
  }

  function floorSystemCost(systemId, currentLevel, state) {
    const def = D.FLOOR_SYSTEMS[systemId];
    const eff = techEffects(state);
    let raw = def.baseCost * Math.pow(def.costGrowth, currentLevel);
    return Math.ceil(raw);
  }

  function collectorTickSeconds(floor, state) {
    // higher collector level -> faster sweep interval
    const lvl = floor.systems.collector;
    const eff = techEffects(state);
    if (lvl <= 0) return null; // no auto collection
    const base = Math.max(0.4, 3.0 - 0.4 * lvl);
    return base * (1 - Math.min(0.5, eff.collectorSpeedMult));
  }

  // ---- Rooms --------------------------------------------------------------
  function roomCost(roomId, currentLevel) {
    const def = D.ROOMS[roomId];
    return Math.ceil(def.baseCost * Math.pow(def.costGrowth, currentLevel));
  }

  function rndRatePerSec(state) {
    const lvl = state.rooms.rnd.level;
    if (lvl <= 0) return 0;
    const def = D.ROOMS.rnd;
    const eff = techEffects(state);
    return (def.baseRatePerSec + def.ratePerLevel * (lvl - 1)) * (1 + eff.rndRateMult);
  }

  function vaultOfflineCapHours(state) {
    const lvl = state.rooms.vault.level;
    const def = D.ROOMS.vault;
    const eff = techEffects(state);
    const base = lvl <= 0 ? 1 : def.baseOfflineCapHours + def.offlineCapPerLevel * (lvl - 1);
    return base + eff.offlineCapAdd;
  }

  function vaultInterestPerHour(state) {
    const lvl = state.rooms.vault.level;
    if (lvl <= 0) return 0;
    const def = D.ROOMS.vault;
    return def.baseInterestPerHour + def.interestPerLevel * lvl;
  }

  function powerCapacity(state) {
    const lvl = state.rooms.power.level;
    const def = D.ROOMS.power;
    if (lvl <= 0) return 0;
    return def.basePower + def.powerPerLevel * (lvl - 1);
  }

  function powerDemand(state) {
    const eff = techEffects(state);
    const discount = 1 - Math.min(0.4, eff.powerDiscount);
    let demand = 0;
    state.zones.forEach((z) => z.floors.forEach((f) => {
      if (f.systems.collector > 0) demand += D.POWER_COST_COLLECTOR * discount;
    }));
    return demand;
  }

  function powerOk(state) {
    return powerDemand(state) <= powerCapacity(state) + 1e-9;
  }

  // ---- Prestige ------------------------------------------------------------
  // First rebirth requires 2M max cash held in the current run. Each later rebirth
  // requires 2.5x the previous peak-cash threshold.
  function prestigeRequirement(state) {
    return D.PRESTIGE.minMaxMoneyToUnlock * Math.pow(2.5, state.prestige.count);
  }

  function prestigeUnlocked(state) {
    return state.maxMoney >= prestigeRequirement(state);
  }

  function prestigeGain(state) {
    const eff = techEffects(state);
    const base = Math.floor(Math.sqrt(state.maxMoney / D.PRESTIGE.divisor));
    return Math.max(0, Math.floor(base * (1 + eff.prestigeGainMult)));
  }

  function techCostAffordable(state, tech) {
    return state.prestige.perkPoints >= tech.cost && state.research >= tech.researchCost;
  }
  function techPurchaseReason(state, tech) {
    if (state.prestige.perkPoints < tech.cost) return "points";
    if (state.research < tech.researchCost) return "research";
    return null;
  }

  function techRequirementsMet(state, tech) {
    return tech.requires.every((r) => !!state.prestige.tech[r]);
  }

  // ---- Formatting -----------------------------------------------------------
  const SUFFIXES = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
  function formatMoney(n) {
    if (n === null || n === undefined || !isFinite(n)) return "0";
    const sign = n < 0 ? "-" : "";
    n = Math.abs(n);
    if (n < 1000) return sign + (Math.floor(n * 100) / 100).toString();
    let tier = 0;
    while (n >= 1000 && tier < SUFFIXES.length - 1) { n /= 1000; tier++; }
    if (tier === SUFFIXES.length - 1 && n >= 1000) return sign + n.toExponential(2).replace("e+", "e");
    const decimals = n < 10 ? 2 : n < 100 ? 1 : 0;
    const fixed = parseFloat(n.toFixed(decimals)); // trims trailing zeros (1.50 -> 1.5, 2.00 -> 2)
    return sign + fixed + SUFFIXES[tier];
  }

  function formatTime(seconds) {
    seconds = Math.max(0, Math.floor(seconds));
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
  }

  G.Econ = {
    techEffects, tierPlacedCount, machineCost, tierUnlocked,
    upgradeCost, machineCooldown, machineBaseYield, machineCritChance, machineCritMult,
    floorOutputMult, floorSystemCost, collectorTickSeconds,
    roomCost, rndRatePerSec, vaultOfflineCapHours, vaultInterestPerHour,
    powerCapacity, powerDemand, powerOk,
    prestigeRequirement, prestigeUnlocked, prestigeGain, techCostAffordable, techPurchaseReason, techRequirementsMet,
    formatMoney, formatTime,
  };
})(window.Game = window.Game || {});

/* ============================================================
   05-factory.js — Factory simulation: machines, conveyors,
   auto-collectors, zones/floors, rooms tick, and the
   offline-earnings simulation. This is the beating heart of the
   idle/active production loop.
   ============================================================ */
(function (G) {
  "use strict";
  const D = G.DATA;
  const E = G.Econ;

  // Runtime-only (non-persisted-critical) per-floor timers, keyed by floor id.
  const floorRuntime = {}; // { [floorId]: { collectorTimer, bonusTimer } }
  function rt(floorId) {
    if (!floorRuntime[floorId]) floorRuntime[floorId] = { collectorTimer: 0, bonusTimer: 3 + Math.random() * 6 };
    return floorRuntime[floorId];
  }

  function getZone(state, zoneId) { return state.zones.find((z) => z.id === zoneId); }
  function getFloor(state, zoneId, floorId) {
    const z = getZone(state, zoneId);
    return z ? z.floors.find((f) => f.id === floorId) : null;
  }
  function currentZone(state) { return getZone(state, state.currentZoneId); }
  function currentFloor(state) { return getFloor(state, state.currentZoneId, state.currentFloorId); }

  // ---- Placement / upgrades ---------------------------------------------
  function canPlaceMachine(state, slot) {
    return !slot.machine;
  }

  function placeMachine(state, zoneId, floorId, r, c, tierId) {

    if (!floor || !floor.unlocked) return { ok: false, reason: "floorLocked" };
    if (!E.tierUnlocked(state, tierId)) return { ok: false, reason: "tierLocked" };
    const slot = floor.grid.find((s) => s.r === r && s.c === c);
    if (!slot || slot.machine) return { ok: false, reason: "occupied" };
    const cost = E.machineCost(state, tierId);

    state.money -= cost;
    const type = D.MACHINE_TYPES.find((m) => m.tierId === tierId);
    slot.machine = {
      typeId: type.id,
      tierId,
      levels: { speed: 0, output: 0, ink: 0 },
      progress: 0,
      banked: 0,
    };
    state.stats.totalMachinesPlaced++;
    return { ok: true, cost, tierId };
  }

  function upgradeMachine(state, zoneId, floorId, r, c, upgradeId) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor) return { ok: false };
    const slot = floor.grid.find((s) => s.r === r && s.c === c);
    if (!slot || !slot.machine) return { ok: false };
    const u = D.UPGRADES[upgradeId];
    if (!u) return { ok: false, reason: "invalid" };
    const cur = slot.machine.levels[upgradeId];
    if (cur >= u.maxLevel) return { ok: false, reason: "max" };
    const cost = E.upgradeCost(upgradeId, cur, state);
    if (state.money < cost) return { ok: false, reason: "money", cost };
    state.money -= cost;
    slot.machine.levels[upgradeId] = cur + 1;
    state.stats.totalUpgradesBought++;
    return { ok: true, cost, newLevel: cur + 1 };
  }

  // ---- Floor systems (conveyor / collector) ---------------------
  function buyFloorSystem(state, zoneId, floorId, systemId) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor) return { ok: false };
    const def = D.FLOOR_SYSTEMS[systemId];
    if (!def) return { ok: false, reason: "invalid" };
    const cur = floor.systems[systemId];
    if (cur >= def.maxLevel) return { ok: false, reason: "max" };
    const cost = E.floorSystemCost(systemId, cur, state);
    if (state.money < cost) return { ok: false, reason: "money", cost };
    // Power check for turning ON the collector (level 0 -> 1)
    if (systemId === "collector" && cur === 0) {
      const eff = E.techEffects(state);
      const discount = 1 - Math.min(0.4, eff.powerDiscount);
      const addedDemand = D.POWER_COST_COLLECTOR * discount;
      const demandAfter = E.powerDemand(state) + addedDemand;
      if (demandAfter > E.powerCapacity(state) + 1e-9) {
        return { ok: false, reason: "power" };
      }
    }
    state.money -= cost;
    floor.systems[systemId] = cur + 1;
    return { ok: true, cost, newLevel: cur + 1 };
  }

  // ---- Zones / floors unlocking -------------------------------------------
  function unlockZone(state, zoneId) {
    const zone = getZone(state, zoneId);
    const def = D.zoneById(zoneId);
    if (!zone || zone.unlocked) return { ok: false };
    if (!def.unlock) { zone.unlocked = true; return { ok: true }; }
    if (def.unlock.type === "money") {
      if (state.money < def.unlock.amount) return { ok: false, reason: "money", cost: def.unlock.amount };
      state.money -= def.unlock.amount;
      zone.unlocked = true;
      return { ok: true };
    }
    if (def.unlock.type === "prestige") {
      if (state.prestige.count < def.unlock.amount) return { ok: false, reason: "prestige" };
      zone.unlocked = true;
      return { ok: true };
    }
    return { ok: false };
  }

  function unlockFloor(state, zoneId, floorId) {
    const floor = getFloor(state, zoneId, floorId);
    const def = D.floorById(zoneId, floorId);
    if (!floor || floor.unlocked) return { ok: false };
    if (!def.unlock) { floor.unlocked = true; return { ok: true }; }
    if (def.unlock.type === "money") {
      if (state.money < def.unlock.amount) return { ok: false, reason: "money", cost: def.unlock.amount };
      state.money -= def.unlock.amount;
      floor.unlocked = true;
      return { ok: true };
    }
    return { ok: false };
  }

  // ---- Rooms -----------------------------------------------------------------
  function upgradeRoom(state, roomId) {
    const def = D.ROOMS[roomId];
    if (!def) return { ok: false, reason: "invalid" };
    const cur = state.rooms[roomId].level;
    if (cur >= def.maxLevel) return { ok: false, reason: "max" };
    const cost = E.roomCost(roomId, cur);
    if (state.money < cost) return { ok: false, reason: "money", cost };
    state.money -= cost;
    state.rooms[roomId].level = cur + 1;
    return { ok: true, cost, newLevel: cur + 1 };
  }

  // ---- Collection ---------------------------------------------------------
  function grantMoney(state, amount) {
    if (!Number.isFinite(amount) || amount <= 0) return;
    state.money += amount;
    state.maxMoney = Math.max(state.maxMoney, state.money);
    state.totalEarned += amount;
    state.lifetimeEarned += amount;
  }

  function collectMachine(state, zoneId, floorId, r, c) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor) return { amount: 0 };
    const slot = floor.grid.find((s) => s.r === r && s.c === c);
    if (!slot || !slot.machine || slot.machine.banked <= 0) return { amount: 0 };
    const amount = slot.machine.banked;
    slot.machine.banked = 0;
    grantMoney(state, amount);
    state.stats.totalClicks++;
    return { amount };
  }

  function collectFloor(state, zoneId, floorId) {
    const floor = getFloor(state, zoneId, floorId);
    if (!floor) return 0;
    let total = 0;
    floor.grid.forEach((s) => {
      if (s.machine && s.machine.banked > 0) { total += s.machine.banked; s.machine.banked = 0; }
    });
    grantMoney(state, total);
    return total;
  }

  function collectAllUnlocked(state) {
    let total = 0;
    state.zones.forEach((z) => { if (z.unlocked) z.floors.forEach((f) => { if (f.unlocked) total += collectFloor(state, z.id, f.id); }); });
    return total;
  }

  // ---- Core production tick (used by live loop, called every frame) --------
  // events: array the caller can push {type,...} onto for render/audio hooks.
  function tickFloor(state, zone, floor, dt, events) {
    const outMult = E.floorOutputMult(floor);
    const hasCollector = floor.systems.collector > 0;
    const r = rt(floor.id);

    floor.grid.forEach((slot) => {
      const m = slot.machine;
      if (!m) return;
      const cooldown = E.machineCooldown(m, state);
      m.progress += dt / cooldown;
      while (m.progress >= 1) {
        m.progress -= 1;
        let yieldAmt = E.machineBaseYield(m, outMult, state);
        let isCrit = Math.random() < E.machineCritChance(m, state);
        if (isCrit) yieldAmt *= E.machineCritMult(m);
        m.banked += yieldAmt;
        if (events) events.push({ type: "cycle", zoneId: zone.id, floorId: floor.id, r: slot.r, c: slot.c, amount: yieldAmt, crit: isCrit });
      }
    });

    if (hasCollector) {
      const tickSec = E.collectorTickSeconds(floor, state);
      r.collectorTimer += dt;
      if (tickSec && r.collectorTimer >= tickSec) {
        r.collectorTimer = 0;
        const total = collectFloor(state, zone.id, floor.id);
        if (total > 0 && events) events.push({ type: "autocollect", zoneId: zone.id, floorId: floor.id, amount: total });
      }
    }

    // Random bonus drop timer (only meaningful on the currently viewed floor,
    // but we run it for all unlocked floors so it's consistent with idle sim).
    r.bonusTimer -= dt;
    if (r.bonusTimer <= 0) {
      r.bonusTimer = 12 + Math.random() * 18;
      const occupied = floor.grid.filter((s) => s.machine);
      if (occupied.length > 0 && events) {
        const pick = occupied[Math.floor(Math.random() * occupied.length)];
        events.push({ type: "bonusReady", zoneId: zone.id, floorId: floor.id, r: pick.r, c: pick.c });
      }
    }
  }

  function tick(state, dt) {
    const events = [];
    state.zones.forEach((zone) => {
      if (!zone.unlocked) return;
      zone.floors.forEach((floor) => {
        if (!floor.unlocked) return;
        tickFloor(state, zone, floor, dt, events);
      });
    });
    // R&D research accrual
    const rndRate = E.rndRatePerSec(state);
    if (rndRate > 0) state.research += rndRate * dt;
    // Vault passive interest, applied continuously (per-hour rate -> per-second)
    const interestPerHour = E.vaultInterestPerHour(state);
    if (interestPerHour > 0 && state.money > 0) {
      grantMoney(state, state.money * (interestPerHour / 3600) * dt);
    }
    state.stats.playTimeSeconds += dt;
    return events;
  }

  // ---- Offline simulation ----------------------------------------------------
  // Deterministic closed-form estimate (not stepped) for performance & to
  // avoid needing to replay potentially many real-world hours tick by tick.
  function computeFloorMps(state, zone, floor) {
    const outMult = E.floorOutputMult(floor);
    let mps = 0;
    floor.grid.forEach((slot) => {
      const m = slot.machine;
      if (!m) return;
      const cooldown = E.machineCooldown(m, state);
      const avgYield = E.machineBaseYield(m, outMult, state) * (1 + E.machineCritChance(m, state) * (E.machineCritMult(m) - 1));
      mps += avgYield / cooldown;
    });
    // Offline mode is an abstract idle estimate: collectors improve cash conversion,
    // while manual floors still retain a reduced passive efficiency.
    const efficiency = floor.systems.collector > 0 ? 0.75 : 0.35;
    return mps * efficiency;
  }

  function simulateOfflineEarnings(state, elapsedSeconds) {
    if (!Number.isFinite(elapsedSeconds) || elapsedSeconds <= 0) return { amount: 0, production: 0, cappedSeconds: 0, capHours: E.vaultOfflineCapHours(state), researchGained: 0, interestGained: 0, wasCapped: false };
    const capHours = E.vaultOfflineCapHours(state);
    const cappedSeconds = Math.min(elapsedSeconds, capHours * 3600);

    let totalMps = 0;
    state.zones.forEach((zone) => {
      if (!zone.unlocked) return;
      zone.floors.forEach((floor) => {
        if (!floor.unlocked) return;
        totalMps += computeFloorMps(state, zone, floor);
      });
    });

    const production = totalMps * cappedSeconds;
    const interestPerHour = E.vaultInterestPerHour(state);
    const ratePerSecond = interestPerHour / 3600;
    const interestGained = interestPerHour > 0
      ? (state.money + totalMps / ratePerSecond) * Math.exp(ratePerSecond * cappedSeconds) - state.money - totalMps / ratePerSecond
      : 0;
    const researchGained = E.rndRatePerSec(state) * cappedSeconds;

    return {
      amount: production + interestGained,
      production,
      interestGained,
      researchGained,
      cappedSeconds,
      capHours,
      wasCapped: elapsedSeconds > cappedSeconds,
    };
  }

  function applyOfflineEarnings(state, result) {
    if (result.amount > 0) grantMoney(state, result.amount);
    if (result.researchGained > 0) state.research += result.researchGained;
  }

  // ---- Prestige (rebirth) -----------------------------------------------------
  function doPrestige(state) {
    if (!E.prestigeUnlocked(state)) return { ok: false };
    const gain = E.prestigeGain(state);
    const techKeep = state.prestige.tech;
    const eff = E.techEffects(state);

    const fresh = G.State.defaultState();
    fresh.settings = state.settings;
    fresh.prestige.count = state.prestige.count + 1;
    fresh.prestige.perkPoints = state.prestige.perkPoints + gain;
    fresh.prestige.tech = techKeep;
    fresh.money = 50 * (1 + eff.startingMoneyMult);
    fresh.maxMoney = fresh.money;
    fresh.lifetimeEarned = state.lifetimeEarned;
    fresh.research = state.research;
    fresh.selectedTierId = "common";
    fresh.stats = state.stats; // keep lifetime stats

    Object.keys(floorRuntime).forEach((k) => delete floorRuntime[k]);

    return { ok: true, gain, newState: fresh };
  }

  // ---- Tech tree purchase ---------------------------------------------------
  function buyTech(state, techId) {
    const tech = D.techById(techId);
    if (!tech) return { ok: false };
    if (state.prestige.tech[techId]) return { ok: false, reason: "owned" };
    if (!E.techRequirementsMet(state, tech)) return { ok: false, reason: "requires" };
    const purchaseReason = E.techPurchaseReason(state, tech);
    if (purchaseReason) return { ok: false, reason: purchaseReason };
    state.prestige.perkPoints -= tech.cost;
    state.research -= tech.researchCost;
    state.prestige.tech[techId] = true;
    return { ok: true };
  }

  G.Factory = {
    getZone, getFloor, currentZone, currentFloor,
    canPlaceMachine, placeMachine, upgradeMachine,
    buyFloorSystem, unlockZone, unlockFloor, upgradeRoom,
    collectMachine, collectFloor, collectAllUnlocked, grantMoney,
    tick, tickFloor,
    simulateOfflineEarnings, applyOfflineEarnings,
    doPrestige, buyTech,
    resetRuntime() { Object.keys(floorRuntime).forEach((k) => delete floorRuntime[k]); },
  };
})(window.Game = window.Game || {});


/* ---- src/08-audio.js ---- */
/* ============================================================
   08-audio.js — All audio is synthesized with the Web Audio API;
   no external audio files. Covers SFX (machine hum, cash, clicks,
   upgrades) and a generative chiptune background loop.
   ============================================================ */
(function (G) {
  "use strict";

  let ctx = null;
  let masterGain, sfxGain, musicGain;
  let unlocked = false;
  let musicEnabled = true, sfxEnabled = true;
  let musicTimer = null;
  let humNodes = new Map(); // key -> {osc, gain}

  function ensureCtx() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(ctx.destination);

    sfxGain = ctx.createGain();
    sfxGain.gain.value = 0.7;
    sfxGain.connect(masterGain);

    musicGain = ctx.createGain();
    musicGain.gain.value = 0.35;
    musicGain.connect(masterGain);
    return ctx;
  }

  function unlock() {
    const c = ensureCtx();
    if (!c) return;
    if (c.state === "suspended") c.resume();
    unlocked = true;
  }

  function setSfxEnabled(v) { sfxEnabled = v; }
  function setMusicEnabled(v) {
    musicEnabled = v;
    if (!v) stopMusic(); else startMusic();
  }
  function setSfxVolume(v) { if (sfxGain) sfxGain.gain.value = v; }
  function setMusicVolume(v) { if (musicGain) musicGain.gain.value = v; }

  // ---- Generic tone helper -------------------------------------------------
  function tone({ freq = 440, type = "sine", dur = 0.15, gain = 0.3, slideTo = null, delay = 0, attack = 0.005, decay = null }) {
    if (!sfxEnabled) return;
    const c = ensureCtx();
    if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (decay || dur));
    osc.connect(g);
    g.connect(sfxGain);
    osc.start(t0);
    osc.stop(t0 + (decay || dur) + 0.05);
  }

    if (!sfxEnabled) return;
    const c = ensureCtx();
    if (!c) return;
    const t0 = c.currentTime + delay;
    const bufferSize = c.sampleRate * dur;
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const src = c.createBufferSource();
    src.buffer = buffer;

    filt.type = "lowpass";
    filt.frequency.value = filterFreq;
    const g = c.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  function sfxClick() { tone({ freq: 700, type: "square", dur: 0.06, gain: 0.15 }); }
  function sfxCollect(amountFactor) {
    // amountFactor 0..1 roughly maps to pitch/brightness of the "cash" chime
    const base = 520 + Math.min(1, amountFactor) * 300;
    tone({ freq: base, type: "triangle", dur: 0.12, gain: 0.22, slideTo: base * 1.6 });
    tone({ freq: base * 1.5, type: "sine", dur: 0.18, gain: 0.12, delay: 0.03, slideTo: base * 2 });
  }
  function sfxCrit() {
    tone({ freq: 660, type: "sawtooth", dur: 0.08, gain: 0.2 });
    tone({ freq: 990, type: "sawtooth", dur: 0.12, gain: 0.18, delay: 0.06 });
    tone({ freq: 1320, type: "sine", dur: 0.2, gain: 0.15, delay: 0.12 });
  }
  function sfxPlaceMachine() {
    noiseBurst({ dur: 0.1, gain: 0.25, filterFreq: 1200 });
    tone({ freq: 220, type: "square", dur: 0.1, gain: 0.15, delay: 0.03, slideTo: 440 });
  }
  function sfxUpgrade() {
    [0, 0.07, 0.14].forEach((d, i) => tone({ freq: 440 + i * 160, type: "square", dur: 0.09, gain: 0.16, delay: d }));
  }
  function sfxUnlock() {
    [0, 0.09, 0.18, 0.27].forEach((d, i) => tone({ freq: 392 * Math.pow(2, i / 12) * 2, type: "triangle", dur: 0.15, gain: 0.18, delay: d }));
  }
  function sfxError() {
    tone({ freq: 180, type: "sawtooth", dur: 0.18, gain: 0.18, slideTo: 90 });
  }
  function sfxPrestige() {
    const notes = [261, 329, 392, 523, 659, 784];
    notes.forEach((f, i) => tone({ freq: f, type: "sine", dur: 0.35, gain: 0.15, delay: i * 0.08, slideTo: f * 2 }));
    noiseBurst({ dur: 0.6, gain: 0.15, filterFreq: 4000, delay: 0.1 });
  }
  function sfxTechUnlock() {
    tone({ freq: 300, type: "sine", dur: 0.25, gain: 0.16, slideTo: 900 });
  }
  function sfxBonus() {
    [0, 0.05, 0.1].forEach((d, i) => tone({ freq: 880 + i * 220, type: "sine", dur: 0.12, gain: 0.16, delay: d }));
  }

  // ---- Machine hum loop (per-machine ambient drone, subtle) -----------------
  function startHum(key, tierOrder) {
    const c = ensureCtx();
    if (!c || humNodes.has(key)) return;
    if (humNodes.size > 24) return; // cap concurrent hums for perf
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = "sine";
    osc.frequency.value = 70 + tierOrder * 12;
    g.gain.value = 0;
    osc.connect(g);
    g.connect(sfxGain);
    osc.start();
    g.gain.linearRampToValueAtTime(0.015 + tierOrder * 0.004, c.currentTime + 0.4);
    humNodes.set(key, { osc, gain: g });
  }
  function stopHum(key) {
    const n = humNodes.get(key);
    if (!n) return;
    const c = ctx;
    try {
      n.gain.gain.linearRampToValueAtTime(0, c.currentTime + 0.3);

    } catch (e) { /* ignore */ }

  // ---- Generative chiptune background music ---------------------------------
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16]; // major pentatonic-ish, extended
  let musicStep = 0;
  function scheduleMusicStep() {
    if (!musicEnabled || !sfxEnabled === undefined) {}
    if (!musicEnabled) return;
    const c = ensureCtx();
    if (!c) return;
    const root = 220;
    const degree = SCALE[musicStep % SCALE.length];
    const freq = root * Math.pow(2, degree / 12);
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = musicStep % 4 === 0 ? "square" : "triangle";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    osc.connect(g);
    g.connect(musicGain);
    osc.start(t0);
    osc.stop(t0 + 0.25);

      const bass = c.createOscillator();
      const bg = c.createGain();
      bass.type = "sine";
      bass.frequency.value = root / 2;
      bg.gain.setValueAtTime(0.0001, t0);
      bg.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
      bg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      bass.connect(bg);
      bg.connect(musicGain);
      bass.start(t0);
      bass.stop(t0 + 0.55);
    }
    musicStep++;
  }

    if (musicTimer || !musicEnabled) return;
    const c = ensureCtx();
    if (!c) return;
    musicTimer = setInterval(scheduleMusicStep, 260);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

    unlock, setSfxEnabled, setMusicEnabled, setSfxVolume, setMusicVolume,
    sfxClick, sfxCollect, sfxCrit, sfxPlaceMachine, sfxUpgrade, sfxUnlock,
    sfxError, sfxPrestige, sfxTechUnlock, sfxBonus,
    startHum, stopHum, stopAllHums,
    startMusic, stopMusic,
    get isUnlocked() { return unlocked; },
  };
})(window.Game = window.Game || {});

  function drawBonusMarker(slot) {

    ctx.closePath();

  // ---- Main frame render -------------------------------------------------------
  function render(state, floor, dt, bonusSlotKey) {
    if (!ctx) return;
    timeAcc += dt;
    ctx.save();
    ctx.scale(dpr, dpr);

    drawFloorBackground(floor);

    floor.grid.forEach((slot) => {
      const isHover = hoverSlot && hoverSlot.r === slot.r && hoverSlot.c === slot.c;
      const isSelected = selectedSlot && selectedSlot.r === slot.r && selectedSlot.c === slot.c;
      if (slot.machine) {
        drawMachine(slot, isHover, isSelected);
        if (bonusSlotKey === slot.r + "_" + slot.c) drawBonusMarker(slot);

    if (keys["KeyS"] || keys["ArrowDown"]) dy += 1;
    if (keys["KeyA"] || keys["ArrowLeft"]) dx -= 1;
    if (keys["KeyD"] || keys["ArrowRight"]) dx += 1;
    const len = Math.hypot(dx, dy);
    if (len > 0.001) {

(function (G) {

  function setState(newState) { state = newState; selectedSlotRef = null; refreshAll(); }

  // ---- Formatting helpers -----------------------------------------------------
  function money(n) { return "$" + E.formatMoney(n); }

  // ---- Toasts -------------------------------------------------------------------
  function toast(message, kind) {
    const el = document.createElement("div");
    el.className = "toast" + (kind === "warn" ? " warn" : "");
    el.textContent = message;
    els.toastStack.appendChild(el);
    setTimeout(() => el.remove(), 2800);
    while (els.toastStack.children.length > 4) els.toastStack.removeChild(els.toastStack.firstChild);
  }

  // ---- HUD ------------------------------------------------------------------------
  function computeMps() {
    let mps = 0;
    state.zones.forEach((z) => { if (!z.unlocked) return; z.floors.forEach((f) => {
      if (!f.unlocked) return;
      const outMult = E.floorOutputMult(f);
      f.grid.forEach((s) => {
        if (!s.machine) return;
        const cd = E.machineCooldown(s.machine, state);
        const avgYield = E.machineBaseYield(s.machine, outMult, state) * (1 + E.machineCritChance(s.machine, state) * (E.machineCritMult(s.machine) - 1));
        mps += avgYield / cd;
      });
    }); });
    return mps;
  }

  function refreshHUD() {
    els.moneyVal.textContent = money(state.money);
    const mps = computeMps();
    els.mpsVal.textContent = mps > 0 ? "+" + E.formatMoney(mps) + G.i18n.t("hud.perSec") : "";
    els.researchVal.textContent = E.formatMoney(state.research);
    const cap = E.powerCapacity(state);
    const demand = E.powerDemand(state);
    els.powerVal.textContent = Math.round(demand) + "/" + Math.round(cap);
    els.powerWrap.style.color = demand > cap ? "var(--accent-warn)" : "";
